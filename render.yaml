services:
  - type: web
    name: resume-editor-backend
    runtime: docker
    # Render builds using the Dockerfile in the repo root (or the rootDir below).
    # No buildCommand/startCommand needed — Dockerfile handles everything.
    plan: free
    # Render free tier sleeps after 15 min of inactivity.
    # Upgrade to 'starter' or higher for always-on behaviour.
    healthCheckPath: /actuator/health
    envVars:
      # ── GitHub OAuth App ──────────────────────────────────────────────────────
      - key: GITHUB_CLIENT_ID
        sync: false          # Set manually in the Render dashboard → Environment tab
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # ── HuggingFace Inference API ─────────────────────────────────────────────
      - key: HF_API_KEY
        sync: false
      - key: HF_MODEL
        value: meta-llama/Llama-3.1-8B-Instruct
      # ── JWT ───────────────────────────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false
      # ── CORS ─────────────────────────────────────────────────────────────────
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000
