services:
  - type: web
    name: resume-editor-backend
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      # ── GitHub OAuth App (set values in Render dashboard → Environment) ────────
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

      # ── Spring Security OAuth2 (Spring maps these automatically from env vars) ─
      - key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_ID
        sync: false
      - key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_SECRET
        sync: false
      - key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_SCOPE
        value: read:user,repo
      - key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_AUTHORIZATION_GRANT_TYPE
        value: authorization_code
      - key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_REDIRECT_URI
        value: "{baseUrl}/login/oauth2/code/{registrationId}"

      # ── HuggingFace Inference API ─────────────────────────────────────────────
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: HUGGINGFACE_MODEL
        value: meta-llama/Llama-3.1-8B-Instruct

      # ── JWT ───────────────────────────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRY_DAYS
        value: "30"

      # ── CORS ─────────────────────────────────────────────────────────────────
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # Set this to your Render URL or * once deployed

      # ── Reverse proxy headers (same as Railway) ───────────────────────────────
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: framework
