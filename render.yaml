services:
  - type: web
    name: resume-editor-backend
    runtime: java
    # Render auto-detects Maven projects; this explicitly sets the build command.
    buildCommand: ./mvnw -q clean package -DskipTests
    # Render injects the PORT env var automatically; Spring Boot reads it via ${PORT:8080}.
    startCommand: java -jar target/resume_editor-0.0.1-SNAPSHOT.jar
    plan: free
    # Render free tier sleeps after 15 min of inactivity — acceptable for dev/hobby use.
    # Upgrade to 'starter' or higher to keep the instance always-on.
    healthCheckPath: /actuator/health
    envVars:
      # ── GitHub OAuth App ──────────────────────────────────────────────────────
      - key: GITHUB_CLIENT_ID
        sync: false          # Set manually in the Render dashboard → Environment tab
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # ── HuggingFace Inference API ─────────────────────────────────────────────
      - key: HF_API_KEY
        sync: false
      - key: HF_MODEL
        value: meta-llama/Llama-3.1-8B-Instruct
      # ── JWT ───────────────────────────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false
      # ── CORS ─────────────────────────────────────────────────────────────────
      # Set this to your Android app's deep-link origin or keep it restrictive.
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000
