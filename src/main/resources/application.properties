spring.application.name=resume_editor

# Actuator — expose only the health endpoint (used by Render for health checks)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# GitHub OAuth App Credentials — sourced from environment variables
github.client-id=${GITHUB_CLIENT_ID:}
github.client-secret=${GITHUB_CLIENT_SECRET:}

# Standard Spring Security OAuth2 Bindings
spring.security.oauth2.client.registration.github.client-id=${github.client-id}
spring.security.oauth2.client.registration.github.client-secret=${github.client-secret}
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.registration.github.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# HuggingFace Inference API — sourced from environment variables
# Set HUGGINGFACE_API_KEY to your HuggingFace token (https://huggingface.co/settings/tokens)
huggingface.api.key=${HUGGINGFACE_API_KEY:your-huggingface-api-key-here}

# Model to use — default is Llama 3.1 8B Instruct (free tier, no daily neuron cap)
huggingface.model=${HUGGINGFACE_MODEL:meta-llama/Llama-3.1-8B-Instruct}

# Allowed CORS origins (comma-separated)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Server Port (uses PORT env var if available, defaults to 8080)
server.port=${PORT:8080}

# JWT
jwt.secret=${JWT_SECRET:myDefaultDevSecretKeyThatIsAtLeast256BitsLong!!}
jwt.expiry.days=${JWT_EXPIRY_DAYS:30}

# Reverse Proxy Support (Required for Render/Railway/Heroku — makes Spring trust X-Forwarded-* headers
# so OAuth2 redirect URIs are built with https:// instead of http://)
server.forward-headers-strategy=framework
